<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Victim to Victor | Be Made Whole | Clyde Lewis</title>
<link rel="stylesheet" href="../brand.css">
<style>
  html, body { overflow: auto; }
  body { background: var(--deep-blue); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 16px; box-sizing: border-box; }
  main { width: 100%; max-width: 1100px; text-align: center; }
  h1 { font-size: clamp(36px, 7vw, 80px); margin: 0 0 32px; }
  h1 .gold { color: var(--accent); }
  video { width: 100%; height: auto; display: block; border-radius: 4px; background: var(--royal-blue); }
  .byline { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 40px 0 28px; flex-wrap: wrap; }
  .byline .headline { font-size: clamp(24px, 4vw, 40px); }
  .byline .bar { width: 2px; height: 36px; background: var(--accent); }
  .byline .author { font-size: clamp(14px, 2vw, 18px); }
  .cta {
    display: inline-block; padding: 20px 40px; border-radius: 2px;
    background: var(--accent); color: var(--deep-blue); text-decoration: none;
    font-family: var(--font-headline); font-weight: 900; letter-spacing: 0.16em; font-size: clamp(14px, 2vw, 18px);
    transition: background .2s ease;
  }
  .cta:hover, .cta:focus-visible { background: var(--accent-soft); }
  .cta:focus-visible { outline: 2px solid var(--warm-ivory); outline-offset: 4px; }
</style>
</head>
<body>
<main>
  <h1 class="headline">From Victim to <span class="gold">Victor</span></h1>
  <video src="../out/victim-to-victor.mp4" controls playsinline preload="metadata"></video>
