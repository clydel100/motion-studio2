<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand.css">
<style>
  #cv { display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
/* ==========================================================================
   SHOWREEL — a 15-second motion design reel, written entirely as code.
   Every frame is a pure function of t. No keyframes, no timeline, no assets.

   120 BPM, one beat = 0.5 s, every cut lands on the beat:
     0.00  01 Ignition      dot, crosshair, burst, title
     2.00  02 Kinetic type  TYPE. SHAPE. SPACE. TIME.  (one technique per beat)
     4.00  03 Geometry      a breathing shape grid, then a zoom through one cell
     6.00  04 3D            2,600 points: sphere -> torus -> cube
     8.00  05 Particles     the same points fly into a word, then explode
    10.00  06 Data          counters, charts, skills
    11.85  07 Finale        title card and the closing line
   Real motion blur: fast moments are rendered several times across a
   shutter interval and averaged.
   ========================================================================== */
window.DURATION = 15;
window.SIZE = [1920, 1080];
window.AUDIO = "../audio/showreel-score.wav";

const W = 1920, H = 1080, CX = W / 2, CY = H / 2, FPS = 30;
const DPR = window.devicePixelRatio || 1;

// ---------- Palette (read from brand.css so the tokens stay the source of truth) ----------
const css = getComputedStyle(document.documentElement);
const tok = (n) => css.getPropertyValue(n).trim();
const C = {
  deep: tok("--deep-blue"), royal: tok("--royal-blue"), mid: tok("--mid-blue"),
  gold: tok("--signature-gold"), soft: tok("--soft-gold"),
  ivory: tok("--warm-ivory"), white: tok("--luminous-white"), muted: tok("--muted-blue"),
};
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const RGB = Object.fromEntries(Object.entries(C).map(([k, v]) => [k, hex(v)]));
const rgba = (name, a = 1) => { const [r, g, b] = RGB[name]; return `rgba(${r},${g},${b},${a})`; };
const mixRGB = (a, b, t) => { const A = RGB[a], B = RGB[b]; return [0, 1, 2].map((i) => Math.round(A[i] + (B[i] - A[i]) * t)); };
const mixStr = (a, b, t, al = 1) => { const [r, g, bb] = mixRGB(a, b, t); return `rgba(${r},${g},${bb},${al})`; };

// ---------- Math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const eOut3 = (x) => 1 - Math.pow(1 - clamp(x), 3);
const eIn3 = (x) => Math.pow(clamp(x), 3);
const eInOut3 = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eOutExpo = (x) => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const eInExpo = (x) => { x = clamp(x); return x === 0 ? 0 : Math.pow(2, 10 * x - 10); };
const eOutBack = (x, s = 1.9) => { x = clamp(x); const c = s + 1; return 1 + c * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
// Damped spring from 0 to 1 (overshoots, settles). x is normalized progress.
const spring = (x, f = 1.6, d = 6) => (x <= 0 ? 0 : x >= 1.6 ? 1 : 1 - Math.exp(-d * x) * Math.cos(2 * Math.PI * f * x));
const TAU = Math.PI * 2;

// Seeded random: identical renders every time.
function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const rng = mulberry32(20261125);
const NOISE = Array.from({ length: 512 }, () => rng());
const noise1 = (x) => { const i = Math.floor(x), f = x - i; const a = NOISE[i & 511], b = NOISE[(i + 1) & 511]; const s = (1 - Math.cos(f * Math.PI)) / 2; return a + (b - a) * s; };

// ---------- Canvases ----------
function makeCanvas() { const c = document.createElement("canvas"); c.width = W * DPR; c.height = H * DPR; return [c, c.getContext("2d")]; }
const cv = document.getElementById("cv");
cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + "px"; cv.style.height = H + "px";
const ctx = cv.getContext("2d");
const [sceneCv, sg] = makeCanvas();

const LATO = (w, s) => `${w} ${s}px Lato`;
const SERIF = (w, s) => `${w} ${s}px 'Cormorant Garamond'`;

// ---------- Drawing helpers ----------
function bg(g, inner, outer) {
  const gr = g.createRadialGradient(CX, CY * 0.9, 0, CX, CY, 1150);
  gr.addColorStop(0, rgba(inner)); gr.addColorStop(1, rgba(outer));
  g.fillStyle = gr; g.fillRect(-200, -200, W + 400, H + 400);
}
function flat(g, name) { g.fillStyle = rgba(name); g.fillRect(-200, -200, W + 400, H + 400); }
function grid(g, alpha, color, step, ox = 0, oy = 0) {
  if (alpha <= 0) return;
  g.strokeStyle = rgba(color, alpha); g.lineWidth = 1; g.beginPath();
  for (let x = CX % step + ox % step - step; x < W + step; x += step) { g.moveTo(x, -10); g.lineTo(x, H + 10); }
  for (let y = CY % step + oy % step - step; y < H + step; y += step) { g.moveTo(-10, y); g.lineTo(W + 10, y); }
  g.stroke();
}
function line(g, x1, y1, x2, y2) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
// Per-letter layout that keeps the font's kerning (prefix widths).
function layout(g, word, font, spacing = 0) {
  g.font = font;
  const xs = [], ws = [];
  for (let i = 0; i < word.length; i++) {
    xs.push(g.measureText(word.slice(0, i)).width + spacing * i);
    ws.push(g.measureText(word[i]).width);
  }
  const total = g.measureText(word).width + spacing * (word.length - 1);
  return { xs, ws, total, centers: xs.map((x, i) => x + ws[i] / 2 - total / 2) };
}
function spaced(g, text, x, y, tracking, align = "center") {
  // Draw text with letter-spacing (in px), aligned around x.
  g.letterSpacing = tracking + "px";
  const w = g.measureText(text).width - tracking;
  g.textAlign = "left";
  const sx = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  g.fillText(text, sx, y);
  g.letterSpacing = "0px";
  return w;
}

// ---------- Global camera: shake + flash on the hits ----------
const HITS = [
  { t: 1.0, a: 22, f: 0.55 }, { t: 2.0, a: 10, f: 0.25 }, { t: 2.5, a: 8 }, { t: 3.0, a: 8 }, { t: 3.5, a: 10 },
  { t: 4.0, a: 6 }, { t: 5.0, a: 7 }, { t: 6.0, a: 14, f: 0.35 }, { t: 7.0, a: 6 }, { t: 7.5, a: 6 },
  { t: 8.65, a: 12, f: 0.2 }, { t: 9.45, a: 26, f: 0.6 }, { t: 10.0, a: 6 }, { t: 11.85, a: 16, f: 0.45 },
];
function shake(t) {
  let x = 0, y = 0, r = 0;
  for (const h of HITS) {
    const d = t - h.t; if (d < 0 || d > 0.6) continue;
    const k = h.a * Math.exp(-d * 9);
    x += k * (noise1(d * 40 + h.t * 17) - 0.5) * 2;
    y += k * (noise1(d * 40 + h.t * 31 + 100) - 0.5) * 2;
    r += k * 0.0009 * (noise1(d * 30 + h.t * 7 + 200) - 0.5);
  }
  return { x, y, r };
}
function flash(t) {
  let f = 0;
  for (const h of HITS) { if (!h.f) continue; const d = t - h.t; if (d >= 0) f += h.f * Math.exp(-d * 12); }
  return Math.min(0.8, f);
}

// ============================ 01 IGNITION (0 - 2) ============================
const BURST = Array.from({ length: 36 }, (_, i) => ({ a: (i / 36) * TAU + (rng() - 0.5) * 0.12, d: rng() * 0.08, w: 2 + rng() * 5, len: 0.6 + rng() * 0.6, gold: rng() > 0.35 }));
function scene1(g, t) {
  bg(g, "royal", "deep");
  grid(g, 0.06 * eOut3(inv(0, 0.8, t)) * (1 - 0.5 * inv(1, 1.6, t)), "ivory", 120);

  // Crosshair with ruler ticks
  const pL = eOutExpo(inv(0.22, 0.9, t)), fadeX = 1 - 0.75 * inv(1.0, 1.4, t);
  if (pL > 0) {
    g.strokeStyle = rgba("gold", 0.6 * fadeX); g.lineWidth = 2;
    const gap = 46, Lx = (W / 2) * pL, Ly = (H / 2) * pL;
    line(g, CX - gap, CY, CX - gap - Lx, CY); line(g, CX + gap, CY, CX + gap + Lx, CY);
    line(g, CX, CY - gap, CX, CY - gap - Ly); line(g, CX, CY + gap, CX, CY + gap + Ly);
    g.strokeStyle = rgba("ivory", 0.35 * fadeX); g.lineWidth = 1.5;
    for (let k = 1; k < 18; k++) {
      const d = gap + k * 52; if (d > gap + Lx) break;
      const h = k % 5 === 0 ? 16 : 7;
      line(g, CX - d, CY - h, CX - d, CY + h); line(g, CX + d, CY - h, CX + d, CY + h);
      if (d < gap + Ly) { line(g, CX - h, CY - d, CX + h, CY - d); line(g, CX - h, CY + d, CX + h, CY + d); }
    }
  }
  // Ring draws itself, then becomes the shockwave
  const pA = eInOut3(inv(0.38, 0.98, t));
  if (t < 1.0 && pA > 0) {
    g.strokeStyle = rgba("gold"); g.lineWidth = 3; g.lineCap = "round";
    g.beginPath(); g.arc(CX, CY, 150, -Math.PI / 2, -Math.PI / 2 + TAU * pA); g.stroke();
    // orbiting marker on the drawing tip
    const a = -Math.PI / 2 + TAU * pA;
    g.fillStyle = rgba("ivory"); g.beginPath(); g.arc(CX + Math.cos(a) * 150, CY + Math.sin(a) * 150, 6, 0, TAU); g.fill();
  }
  // Core dot
  let dotR = 11 * spring(inv(0.12, 0.7, t) * 1.2);
  if (t >= 0.85) dotR *= 1 - 0.6 * eIn3(inv(0.85, 1.0, t)); // inhale before the hit
  if (t >= 1.0) dotR = 70 * (1 - eOut3(inv(1.0, 1.3, t)));
  if (dotR > 0.2) {
    const glow = g.createRadialGradient(CX, CY, 0, CX, CY, dotR * 6);
    glow.addColorStop(0, rgba("gold", 0.45)); glow.addColorStop(1, rgba("gold", 0));
    g.fillStyle = glow; g.fillRect(CX - dotR * 6, CY - dotR * 6, dotR * 12, dotR * 12);
    g.fillStyle = rgba("gold"); g.beginPath(); g.arc(CX, CY, dotR, 0, TAU); g.fill();
  }
  if (t >= 1.0) {
    // Speed lines
    g.lineCap = "round";
    for (const b of BURST) {
      const head = 150 + 1100 * b.len * eOutExpo(inv(1.0 + b.d, 1.55 + b.d, t));
      const tail = 150 + 1100 * b.len * eOut3(inv(1.06 + b.d, 1.75 + b.d, t));
      if (head - tail < 1) continue;
      g.strokeStyle = rgba(b.gold ? "gold" : "ivory", 0.9); g.lineWidth = b.w;
      line(g, CX + Math.cos(b.a) * tail, CY + Math.sin(b.a) * tail, CX + Math.cos(b.a) * head, CY + Math.sin(b.a) * head);
    }
    // Shockwave rings
    for (let j = 0; j < 3; j++) {
      const p = inv(1.0 + j * 0.06, 1.7 + j * 0.12, t); if (p <= 0 || p >= 1) continue;
      g.strokeStyle = rgba(j === 1 ? "ivory" : "gold", 1 - p); g.lineWidth = 16 * (1 - p) + 1;
      g.beginPath(); g.arc(CX, CY, 150 + 1000 * eOutExpo(p) * (1 - j * 0.18), 0, TAU); g.stroke();
    }
    // Title: letters converge from wide tracking
    const word = "SHOWREEL", L = layout(g, word, LATO(900, 190), 18);
    g.textBaseline = "middle"; g.textAlign = "center";
    for (let i = 0; i < word.length; i++) {
      const o = Math.abs(i - (word.length - 1) / 2);
      const p = eOutExpo(inv(1.03 + o * 0.03, 1.5 + o * 0.03, t));
      if (p <= 0) continue;
      g.fillStyle = rgba("ivory", p);
      g.fillText(word[i], CX + L.centers[i] * (1 + 0.9 * (1 - p)), CY + 6 + 40 * (1 - p));
    }
    g.font = LATO(900, 26); g.fillStyle = rgba("gold", eOut3(inv(1.2, 1.5, t)));
    spaced(g, "MOTION DESIGN  ·  2026", CX, CY - 150, 11);
    g.font = LATO(400, 22); g.fillStyle = rgba("muted", eOut3(inv(1.3, 1.6, t)));
    spaced(g, "15 SECONDS   ·   450 FRAMES   ·   ZERO KEYFRAMES", CX, CY + 150, 8);
  }
  // Iris to gold (next scene's background)
  const pI = eInExpo(inv(1.7, 2.0, t));
  if (pI > 0) { g.fillStyle = rgba("gold"); g.beginPath(); g.arc(CX, CY, 1150 * pI, 0, TAU); g.fill(); }
}

// ============================ 02 KINETIC TYPE (2 - 4) ============================
const WORDS = [
  { w: "TYPE.", bg: "gold", fg: "deep" },
  { w: "SHAPE.", bg: "deep", fg: "gold" },
  { w: "SPACE.", bg: "ivory", fg: "deep" },
  { w: "TIME.", bg: "royal", fg: "ivory" },
];
const WARP = Array.from({ length: 140 }, () => ({ a: rng() * TAU, o: rng(), w: 1 + rng() * 3 }));
let TIME_CANVAS = null; // pre-rendered in READY (needs the font)
function scene2(g, lt) {
  const idx = Math.min(3, Math.floor(lt / 0.5)), u = lt - idx * 0.5, Wd = WORDS[idx];
  flat(g, Wd.bg);
  g.textBaseline = "middle"; g.textAlign = "center";
  const F = LATO(900, 320), L = layout(g, Wd.w, F, 6);
  g.font = F;

  if (idx === 0) { // TYPE. — marquee texture + letters drop on springs
    g.font = LATO(900, 200); g.strokeStyle = rgba("deep", 0.12); g.lineWidth = 2;
    for (let r = -1; r < 6; r++) {
      const dir = r % 2 ? 1 : -1, off = ((u * 900 * dir) % 1100) - 1100;
      for (let k = 0; k < 4; k++) g.strokeText("TYPE TYPE", off + k * 1100 + 300, r * 210 + 80);
    }
    g.font = F;
    for (let i = 0; i < Wd.w.length; i++) {
      const p = spring(inv(i * 0.035, i * 0.035 + 0.38, u), 1.4, 5.5);
      g.save(); g.translate(CX + L.centers[i], CY + 10 - 760 * (1 - p));
      g.scale(1 - 0.12 * (1 - p), 1 + 0.35 * (1 - p)); g.fillStyle = rgba("deep"); g.fillText(Wd.w[i], 0, 0); g.restore();
    }
    const pb = eOutExpo(inv(0.12, 0.4, u));
    g.fillStyle = rgba("deep"); g.fillRect(CX - L.total / 2, CY + 150, L.total * pb, 14);
  } else if (idx === 1) { // SHAPE. — geometry orbiting + echo outlines + letters spin-scale in
    const pr = eOutExpo(inv(0, 0.4, u));
    g.lineWidth = 3; g.strokeStyle = rgba("ivory", 0.35);
    g.beginPath(); g.arc(CX, CY, 420, -Math.PI / 2, -Math.PI / 2 + TAU * pr); g.stroke();
    const shapes = [0, 1, 2];
    shapes.forEach((s, k) => {
      const a = u * 2.4 + k * (TAU / 3) - 0.9, x = CX + Math.cos(a) * 640, y = CY + Math.sin(a) * 330, sc = eOutBack(inv(0.04 + k * 0.05, 0.3 + k * 0.05, u));
      g.save(); g.translate(x, y); g.rotate(u * 4 + k); g.scale(sc, sc);
      g.strokeStyle = rgba(k === 1 ? "ivory" : "gold"); g.lineWidth = 6; g.beginPath();
      if (s === 0) g.arc(0, 0, 46, 0, TAU);
      else if (s === 1) g.rect(-42, -42, 84, 84);
      else { g.moveTo(0, -54); g.lineTo(48, 30); g.lineTo(-48, 30); g.closePath(); }
      g.stroke(); g.restore();
    });
    for (let e = 3; e >= 1; e--) {
      const p = eOut3(inv(0.08 + e * 0.04, 0.4 + e * 0.04, u));
      g.save(); g.translate(CX, CY); g.scale(1 + e * 0.09 * p, 1 + e * 0.09 * p);
      g.strokeStyle = rgba("gold", 0.35 * p / e); g.lineWidth = 2; g.strokeText(Wd.w, 0, 10); g.restore();
    }
    for (let i = 0; i < Wd.w.length; i++) {
      const p = eOutBack(inv(i * 0.03, i * 0.03 + 0.3, u), 2.2);
      if (p <= 0) continue;
      g.save(); g.translate(CX + L.centers[i], CY + 10); g.rotate((1 - p) * -1.1); g.scale(p, p);
      g.fillStyle = rgba("gold"); g.fillText(Wd.w[i], 0, 0); g.restore();
    }
  } else if (idx === 2) { // SPACE. — warp streaks + letters arrive from depth
    g.lineCap = "round";
    for (const s of WARP) {
      const d = (s.o + u * 1.8) % 1, r1 = 80 + d * d * 1500, r2 = r1 + 20 + d * 260;
      g.strokeStyle = rgba("mid", 0.18 + 0.4 * d); g.lineWidth = s.w * (0.4 + d);
      line(g, CX + Math.cos(s.a) * r1, CY + Math.sin(s.a) * r1, CX + Math.cos(s.a) * r2, CY + Math.sin(s.a) * r2);
    }
    for (let i = 0; i < Wd.w.length; i++) {
      const o = Math.abs(i - 2.5);
      const p = eOutExpo(inv(o * 0.03, 0.32 + o * 0.03, u));
      const z = 4200 * (1 - p), s = 1000 / (1000 + z);
      if (p <= 0) continue;
      g.save(); g.translate(CX + L.centers[i] * s * (1 + 0.6 * (1 - p)), CY + 10); g.scale(s, s);
      g.fillStyle = rgba("deep", clamp(s * 1.4)); g.fillText(Wd.w[i], 0, 0); g.restore();
    }
  } else { // TIME. — clock + glitch slices with RGB split, then slice-wipe out
    g.strokeStyle = rgba("ivory", 0.16); g.lineWidth = 2;
    g.beginPath(); g.arc(CX, CY, 430, 0, TAU); g.stroke();
    for (let k = 0; k < 60; k++) {
      const a = (k / 60) * TAU, r0 = k % 5 === 0 ? 395 : 412;
      g.strokeStyle = rgba(k % 5 === 0 ? "gold" : "ivory", k % 5 === 0 ? 0.8 : 0.25); g.lineWidth = k % 5 === 0 ? 4 : 2;
      line(g, CX + Math.cos(a) * r0, CY + Math.sin(a) * r0, CX + Math.cos(a) * 428, CY + Math.sin(a) * 428);
    }
    const ha = -Math.PI / 2 + eOutExpo(inv(0, 0.4, u)) * TAU * 1.5;
    g.strokeStyle = rgba("gold"); g.lineWidth = 6; g.lineCap = "round";
    line(g, CX, CY, CX + Math.cos(ha) * 380, CY + Math.sin(ha) * 380);
    // glitch
    const amp = 190 * (1 - eOut3(inv(0, 0.2, u))) + 70 * Math.exp(-Math.pow((u - 0.27) / 0.02, 2));
    const split = 5 + amp * 0.18, strips = 16, top = CY - 190, sh = 380 / strips, step = Math.floor(u * 30);
    const tc = TIME_CANVAS;
    for (let s = 0; s < strips; s++) {
      const n = (noise1(s * 13.7 + step * 3.1) - 0.5) * 2, dx = n * amp, y = top + s * sh;
      const sy = y * DPR, shh = sh * DPR;
      g.globalAlpha = 0.85; g.drawImage(tc.gold, 0, sy, W * DPR, shh, dx - split, y, W, sh);
      g.drawImage(tc.mid, 0, sy, W * DPR, shh, dx + split, y, W, sh);
      g.globalAlpha = 1; g.drawImage(tc.ivory, 0, sy, W * DPR, shh, dx, y, W, sh);
    }
    // slice wipe into the next scene's background
    for (let b = 0; b < 12; b++) {
      const p = eInOut3(inv(0.3 + b * 0.01, 0.46 + b * 0.01, u)); if (p <= 0) continue;
      g.fillStyle = rgba("deep");
      if (b % 2) g.fillRect(b * 160, 0, 161, H * p); else g.fillRect(b * 160, H * (1 - p), 161, H * p);
    }
  }
}

// ============================ 03 GEOMETRY (4 - 6) ============================
const CELLS = [];
for (let j = 0; j < 9; j++) for (let i = 0; i < 17; i++) {
  const x = CX + (i - 8) * 120, y = CY + (j - 4) * 120;
  CELLS.push({ x, y, d: Math.hypot(i - 8, j - 4), ring: (i + j) % 2 === 1, center: i === 8 && j === 4 });
}
function scene3(g, lt) {
  flat(g, "deep");
  const pz = inv(1.3, 2.0, lt), Z = Math.pow(48, eIn3(pz)), rot = 0.7 * eIn3(pz);
  g.save(); g.translate(CX, CY); g.scale(Z, Z); g.rotate(rot); g.translate(-CX, -CY);
  grid(g, 0.05, "ivory", 120, 60, 60);
  for (const c of CELLS) {
    const appear = eOutBack(inv(c.d * 0.04, 0.32 + c.d * 0.04, lt));
    if (appear <= 0) continue;
    const wave = Math.sin(lt * 5.5 - c.d * 0.85);
    const rip = lt > 1 ? Math.exp(-Math.pow(c.d - (lt - 1) * 16, 2) / 3) : 0;
    const m = 0.5 + 0.5 * wave;
    const s = (30 + 10 * wave + 22 * rip) * appear;
    if (c.center) {
      g.strokeStyle = rgba("gold"); g.lineWidth = 9;
      g.beginPath(); g.arc(c.x, c.y, 36 * appear, 0, TAU); g.stroke();
      continue;
    }
    g.save(); g.translate(c.x, c.y); g.rotate(m * Math.PI / 4 + rip * Math.PI / 2);
    const col = mixStr("mid", "gold", clamp(0.25 + 0.35 * m + rip));
    g.beginPath(); g.roundRect(-s, -s, s * 2, s * 2, s * (1 - m));
    if (c.ring) { g.strokeStyle = col; g.lineWidth = 4; g.stroke(); } else { g.fillStyle = col; g.fill(); }
    g.restore();
  }
  g.restore();
}

// ============================ 04+05 3D POINTS -> PARTICLES (6 - 10) ============================
const N = 2600;
const P = { sphere: new Float32Array(N * 3), torus: new Float32Array(N * 3), cube: new Float32Array(N * 3), text: new Float32Array(N * 3) };
const PR = Array.from({ length: N }, () => ({ d: rng(), e: rng(), ax: rng() * TAU, sz: 0.7 + rng() * 0.6 }));
(function buildShapes() {
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (2 * (i + 0.5)) / N, r = Math.sqrt(1 - y * y), th = ga * i;
    P.sphere.set([Math.cos(th) * r, y, Math.sin(th) * r], i * 3);

  await window.READY;
  const [n, shutter] = blurAt(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let k = 0; k < n; k++) {
    const tk = Math.max(shotStart(t), n === 1 ? t : t - shutter * (1 - k / (n - 1)));
    drawFrame(sg, tk);
    ctx.globalAlpha = 1 / (k + 1);
    ctx.drawImage(sceneCv, 0, 0);
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  overlays(ctx, t);
};
</script>
